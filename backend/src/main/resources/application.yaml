spring:
  application:
    name: ADL
  ai:
    openai:
      # DeepSeek 提供 OpenAI 兼容接口，继续使用 Spring AI OpenAI starter。
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat
  datasource: #配置数据源
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/lab_device_db
server:
    port: 8080
